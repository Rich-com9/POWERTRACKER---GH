openapi: 3.0.3
info:
  title: PowerTracker GH API
  version: 1.0.0
  description: API for reporting and tracking electricity outages in Ghana.
paths:
  /api/areas/:
    get:
      operationId: areas_list
      tags:
      - areas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
          description: ''
    post:
      operationId: areas_create
      tags:
      - areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Area'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Area'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /api/areas/{id}/:
    get:
      operationId: areas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - areas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /api/auth/admin/dashboard/:
    get:
      operationId: auth_admin_dashboard_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/saved-areas/:
    get:
      operationId: auth_saved_areas_list
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedArea'
          description: ''
    post:
      operationId: auth_saved_areas_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedArea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedArea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedArea'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedArea'
          description: ''
  /api/auth/saved-areas/{id}/:
    delete:
      operationId: auth_saved_areas_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/read/:
    put:
      operationId: notifications_read_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Notification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Notification'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
    patch:
      operationId: notifications_read_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotification'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/outages/:
    get:
      operationId: outages_list
      tags:
      - outages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutageReport'
          description: ''
    post:
      operationId: outages_create
      tags:
      - outages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutageReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutageReport'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReport'
          description: ''
  /api/outages/{id}/:
    get:
      operationId: outages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageReport'
          description: ''
  /api/outages/{id}/confirm/:
    post:
      operationId: outages_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageConfirmationResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutageConfirmationResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutageConfirmationResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageConfirmationResponse'
          description: ''
  /api/outages/{id}/reject/:
    post:
      operationId: outages_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageRejectResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutageRejectResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutageRejectResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageRejectResponse'
          description: ''
  /api/outages/{id}/resolve/:
    post:
      operationId: outages_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageResolveResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutageResolveResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutageResolveResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutageResolveResponse'
          description: ''
  /api/outages/active/:
    get:
      operationId: outages_active_list
      tags:
      - outages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutageReport'
          description: ''
components:
  schemas:
    AdminDashboard:
      type: object
      properties:
        users:
          type: integer
        areas:
          type: integer
        total_outages:
          type: integer
        active_outages:
          type: integer
        restored_outages:
          type: integer
        outages_today:
          type: integer
        total_confirmations:
          type: integer
        saved_areas:
          type: integer
        unread_notifications:
          type: integer
      required:
      - active_outages
      - areas
      - outages_today
      - restored_outages
      - saved_areas
      - total_confirmations
      - total_outages
      - unread_notifications
      - users
    Area:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        region:
          type: string
          maxLength: 100
        active_outage_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_outage_count
      - created_at
      - id
      - name
      - region
      - updated_at
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        outage:
          type: integer
          readOnly: true
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - notification_type
      - outage
      - title
    NotificationTypeEnum:
      enum:
      - outage
      - restored
      - confirmation
      - system
      type: string
      description: |-
        * `outage` - Outage
        * `restored` - Restored
        * `confirmation` - Confirmation
        * `system` - System
    OutageConfirmationResponse:
      type: object
      properties:
        message:
          type: string
        outage_id:
          type: integer
        confirmations:
          type: integer
      required:
      - confirmations
      - message
      - outage_id
    OutageRejectResponse:
      type: object
      properties:
        message:
          type: string
        outage_id:
          type: integer
        status:
          type: string
      required:
      - message
      - outage_id
      - status
    OutageReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reported_by:
          type: integer
          readOnly: true
        reported_by_name:
          type: string
          readOnly: true
        area:
          type: integer
        area_name:
          type: string
          readOnly: true
        description:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        outage_type:
          $ref: '#/components/schemas/OutageTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        confirmations:
          type: integer
          readOnly: true
        reported_at:
          type: string
          format: date-time
          readOnly: true
        restored_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - area
      - area_name
      - confirmations
      - id
      - latitude
      - longitude
      - reported_at
      - reported_by
      - reported_by_name
      - restored_at
    OutageResolveResponse:
      type: object
      properties:
        message:
          type: string
        outage_id:
          type: integer
        status:
          type: string
        restored_at:
          type: string
          format: date-time
      required:
      - message
      - outage_id
      - restored_at
      - status
    OutageTypeEnum:
      enum:
      - planned
      - unplanned
      - unknown
      type: string
      description: |-
        * `planned` - Planned
        * `unplanned` - Unplanned
        * `unknown` - Unknown
    PatchedNotification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        outage:
          type: integer
          readOnly: true
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    SavedArea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        area:
          type: integer
        area_name:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - area_name
      - created_at
      - id
      - region
    StatusEnum:
      enum:
      - active
      - restored
      - rejected
      type: string
      description: |-
        * `active` - Active
        * `restored` - Restored
        * `rejected` - Rejected
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
      required:
      - email
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
